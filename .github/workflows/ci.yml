name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  vet-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: "1.24"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build (Windows)
        run: GOOS=windows GOARCH=amd64 go build -o mcpguard-win.exe .

      - name: Build (Linux)
        run: GOOS=linux GOARCH=amd64 go build -o mcpguard-linux .

      - name: Build (macOS)
        run: GOOS=darwin GOARCH=arm64 go build -o mcpguard-mac .
